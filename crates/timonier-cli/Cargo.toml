[package]
name = "timonier-cli"
description = "The timonier command line (alias tim)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "timonier_cli"
path = "src/lib.rs"

# Two names for the same program: `tim` is the short alias (docs/adr/0003).
[[bin]]
name = "timonier"
path = "src/main.rs"

[[bin]]
name = "tim"
path = "src/bin/tim.rs"

[dependencies]
timonier-core = { workspace = true }
timonier-daemon = { workspace = true }
timonier-mcp = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }

[lints]
workspace = true
