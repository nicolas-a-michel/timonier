# Rust language pack. Format: docs/adr/0012-format-des-packs-de-langage.md
# Bump `version` whenever a query or a rule below changes: it keys the extraction cache.
format = 1
language = "rust"
version = "1.1.0"
ecosystem = "cargo"

[[grammars]]
name = "rust"
crate = "tree-sitter-rust"
version = "0.24.2"
license = "MIT"
extensions = ["rs"]

[naming]
module = "::"
join = "::"
member = "::"

[paths]
# How a path written in the code splits into segments, and what an import list prefixes.
separators = ["::"]
prefix_field = "path"
# `use a::{self}` imports `a`.
trailing_self = "self"
# `use a::b::C` binds `C`; `use a::b::C as D` binds `D`.
bind = "last_segment"

[fingerprint]
# Literals are kept whole: their content is meaning, not layout.
atoms = ["string_literal", "raw_string_literal", "char_literal"]
drop = []
drop_before_closing = [","]
closing = [")", "]", "}", ">"]

[signature]
no_space_before = [")", "]", ">", ",", ";", ":", ".", "::", "?"]
tight_after_word = ["(", "<", "["]
no_space_after = ["(", "[", "<", "&", "*", "!", ".", "::", "#", "'"]

# Usage categories of external dependencies (spec: network, serialisation, database, async).
[dependencies]
async = ["tokio", "async-std", "smol", "futures", "async-trait", "tokio-util", "tokio-stream"]
network = [
  "hyper", "axum", "reqwest", "tonic", "warp", "actix-web", "tower", "tower-http",
  "jsonrpsee", "rmcp", "async-lsp", "tower-lsp-server", "ureq", "http",
]
serialization = [
  "serde", "serde_json", "toml", "prost", "bincode", "rmp-serde", "serde_yaml", "schemars",
  "quick-junit", "cyclonedx-bom", "scip",
]
database = ["rusqlite", "rusqlite_migration", "sqlx", "diesel", "sea-orm", "redis", "refinery"]
cli = ["clap", "argh", "pico-args"]
observability = [
  "tracing", "tracing-subscriber", "tracing-opentelemetry", "opentelemetry", "opentelemetry_sdk",
  "opentelemetry-otlp", "opentelemetry-proto", "log", "env_logger",
]
parsing = ["tree-sitter", "tree-sitter-rust", "tree-sitter-typescript", "syn", "nom", "winnow"]

# Role signals (spec « Composants »): libraries a package depends on, and paths its code
# imports. The roles query adds signals read in the code itself; a data model shows there,
# by its share of files deriving Serialize or Deserialize (ADR 0017), not by importing serde.
[[roles]]
role = "entry_point"
libraries = ["clap", "axum", "actix-web", "warp", "hyper", "tonic", "jsonrpsee", "rmcp"]
paths = [
  "std::net::TcpListener", "tokio::net::TcpListener", "tokio::net::UnixListener",
  "std::os::unix::net::UnixListener",
]
confidence = 0.8

[[roles]]
role = "persistence"
libraries = ["rusqlite", "sqlx", "diesel", "sea-orm", "redis", "refinery", "rusqlite_migration"]
confidence = 0.8

[[roles]]
role = "background_task"
libraries = ["notify", "notify-debouncer-full", "notify-debouncer-mini", "crossbeam-channel", "cron"]
paths = ["std::thread::spawn", "tokio::spawn", "tokio::task::spawn_blocking", "notify::Watcher"]
confidence = 0.5

# What refinement needs to know of the language (ADR 0022).
[lsp]
# Names of the standard library and its prelude: a path tree-sitter cannot resolve that starts
# with one of them is defined outside the repository, and the language server is not asked.
# A crate that defines its own `Result` or `Error` is resolved by tree-sitter first.
outside = [
  "std", "core", "alloc", "Self",
  "Option", "Some", "None", "Result", "Ok", "Err", "String", "Vec", "Box", "Rc", "Arc", "Weak",
  "Cell", "RefCell", "Mutex", "RwLock", "Cow", "HashMap", "HashSet", "BTreeMap", "BTreeSet",
  "VecDeque", "BinaryHeap", "Path", "PathBuf", "Duration", "Instant", "SystemTime", "PhantomData",
  "Default", "Clone", "Copy", "Debug", "Display", "Eq", "PartialEq", "Ord", "PartialOrd", "Hash",
  "Send", "Sync", "Sized", "Unpin", "Iterator", "IntoIterator", "DoubleEndedIterator",
  "ExactSizeIterator", "Extend", "FromIterator", "From", "Into", "TryFrom", "TryInto", "AsRef",
  "AsMut", "Borrow", "Deref", "DerefMut", "Drop", "Fn", "FnMut", "FnOnce", "ToString", "ToOwned",
  "Future", "Pin", "Formatter",
]

# How the tests run and write JUnit XML (ADR 0034). `cargo test` has no stable JUnit output:
# cargo-nextest writes it through a profile of .config/nextest.toml (nexte.st/book/junit).
[[tests.runners]]
name = "cargo-nextest"
command = "cargo nextest run --profile timonier"
junit = "target/nextest/timonier/junit.xml"
program = "cargo-nextest"
note = "Timonier reads the tests' JUnit XML through cargo-nextest: install it (`cargo install cargo-nextest --locked`)."

# Timonier's smoke test (spec « Initialisation », 7): `timonier doctor` runs it under
# `timonier test`; plain `cargo test` is enough, the JUnit is not read.
[tests.runners.smoke]
command = "cargo test --features otel --test timonier_smoke"
files = [{ path = "tests/timonier_smoke.rs", source = "instrumentation/timonier_smoke.rs" }]

[tests.runners.config]
file = ".config/nextest.toml"
text = """
# The tests' JUnit XML, for `timonier test` (timonier init).
[profile.timonier.junit]
path = "junit.xml\""""

# The OpenTelemetry SDK `timonier init` adds (spec « Initialisation », 3; ADR 0050): optional
# dependencies of the root package behind the feature `otel`, and the initialisation module.
# Versions verified on 2026-10-21, upgraded together.
[instrumentation]
feature = "otel"
files = [{ path = "src/timonier_otel.rs", source = "instrumentation/timonier_otel.rs" }]
note = "the module `src/timonier_otel.rs` starts the export: declare it with `#[cfg(feature = \"otel\")] mod timonier_otel;` and keep `let _otel = timonier_otel::init();` alive at the start of `main`, as the conventions say."

[[instrumentation.dependencies]]
name = "tracing"
version = "0.1.44"

[[instrumentation.dependencies]]
name = "tracing-subscriber"
version = "0.3.23"
default_features = false
features = ["registry", "std"]

[[instrumentation.dependencies]]
name = "tracing-opentelemetry"
version = "0.34.0"
default_features = false

[[instrumentation.dependencies]]
name = "opentelemetry"
version = "0.33.1"
default_features = false
features = ["trace"]

[[instrumentation.dependencies]]
name = "opentelemetry_sdk"
version = "0.33.1"
default_features = false
features = ["trace"]

[[instrumentation.dependencies]]
name = "opentelemetry-otlp"
version = "0.33.1"
default_features = false
features = ["trace", "grpc-tonic"]

[[instrumentation.dependencies]]
name = "tokio"
version = "1.53.3"
features = ["rt-multi-thread"]

# The technology inventory (ADR 0055): frameworks, and the precise function of known packages:
# two direct dependencies of the same function are a duplicate.
[inventory]
frameworks = ["axum", "actix-web", "rocket", "warp", "tokio", "tonic", "tauri", "bevy", "leptos", "dioxus"]

[inventory.functions]
http-client = ["reqwest", "ureq", "isahc", "surf", "attohttpc", "minreq"]
http-server = ["axum", "actix-web", "rocket", "warp", "poem", "tide"]
async-runtime = ["tokio", "async-std", "smol"]
cli-parser = ["clap", "argh", "pico-args", "structopt", "gumdrop"]
logging = ["log", "tracing", "slog"]
error-handling = ["anyhow", "eyre", "color-eyre"]
date-time = ["chrono", "time", "jiff"]
json = ["serde_json", "simd-json", "json"]
sqlite = ["rusqlite", "sqlite", "sqlx"]
regex = ["regex", "fancy-regex", "onig"]
random = ["rand", "fastrand", "oorandom"]
hashing = ["blake3", "sha2", "md-5", "xxhash-rust", "twox-hash"]
temp-files = ["tempfile", "tempdir"]
