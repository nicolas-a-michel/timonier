[package]
name = "timonier-cli"
description = "The timonier command line (alias tim)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "timonier_cli"
path = "src/lib.rs"

# Two names for the same program: `tim` is the short alias (docs/adr/0003).
[[bin]]
name = "timonier"
path = "src/main.rs"

[[bin]]
name = "tim"
path = "src/bin/tim.rs"

[dependencies]
timonier-core = { workspace = true }
timonier-daemon = { workspace = true }
timonier-mcp = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
junit-parser = { workspace = true }
serde = { workspace = true }
blake3 = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The export of Timonier's own spans (ADR 0044), behind `otel`.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[features]
# Timonier's own instrumentation, on by default (ADR 0044): without it, no OpenTelemetry at all.
default = ["otel"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tokio",
    "dep:tracing-opentelemetry",
]

[target.'cfg(target_os = "linux")'.dependencies]
perf-event = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
timonier-store = { workspace = true }
# The instrumented test process of `examples/emit_spans.rs` (PLAN.md 8.4).
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }

# getrusage, for the measuring relay (ADR 0045); Unix only (T-125).
# The daemon's standard handles kept to the CLI on Windows (ADR 0060).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[lints]
workspace = true
