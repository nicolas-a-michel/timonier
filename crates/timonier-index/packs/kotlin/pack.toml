# Kotlin language pack. Format: docs/adr/0012-format-des-packs-de-langage.md
# Bump `version` whenever a query or a rule below changes: it keys the extraction cache.
format = 1
language = "kotlin"
version = "1.0.1"
ecosystem = "maven"

# `tree-sitter-kotlin-ng` (tree-sitter-grammars) is maintained; `tree-sitter-kotlin` 0.3.8 dates
# from 2024. Verified on 2026-10-22. Members written on the line of their `{` do not parse: the
# rest of the file is still read (ADR 0066).
[[grammars]]
name = "kotlin"
crate = "tree-sitter-kotlin-ng"
version = "1.1.0"
license = "MIT"
extensions = ["kt", "kts"]

# Build outputs, never the project's code.
[walk]
skip = ["build", "out", ".gradle"]

# `kotlin:com.shop.Cart#Cart.total`: the file's dotted path from the source root, then the
# definitions in it (ADR 0066).
[naming]
module = "."
join = "#"
member = "."

[paths]
separators = ["."]
# An import binds its last segment, or its alias (`import a.B as C`).
bind = "last_segment"

[fingerprint]
atoms = ["string_literal", "character_literal", "multiline_string_literal"]
drop = [";"]
drop_before_closing = [","]
closing = [")", "]", "}", ">"]
opening = ["=", "(", "[", "{", "<", ":", ",", "->"]

[signature]
no_space_before = [")", "]", ">", ",", ";", ".", "(", "?", ":"]
tight_after_word = ["(", "<", "["]
no_space_after = ["(", "[", "<", ".", "@", "?."]

# Usage categories of external dependencies (spec: network, serialisation, database, async).
# Dependencies are `group:artifact`.
[dependencies]
async = ["org.jetbrains.kotlinx:kotlinx-coroutines-core", "io.projectreactor:reactor-core", "io.reactivex.rxjava3:rxjava"]
network = [
  "org.springframework.boot:spring-boot-starter-web", "org.springframework.boot:spring-boot-starter-webflux",
  "io.netty:netty-all", "com.squareup.okhttp3:okhttp", "org.apache.httpcomponents.client5:httpclient5",
  "io.vertx:vertx-core", "io.javalin:javalin", "io.grpc:grpc-netty", "io.quarkus:quarkus-rest",
  "io.ktor:ktor-server-core", "io.ktor:ktor-server-netty", "io.ktor:ktor-client-core",
]
serialization = [
  "com.fasterxml.jackson.core:jackson-databind", "com.google.code.gson:gson",
  "com.google.protobuf:protobuf-java", "org.yaml:snakeyaml",
  "org.jetbrains.kotlinx:kotlinx-serialization-json", "com.squareup.moshi:moshi",
]
database = [
  "org.springframework.boot:spring-boot-starter-data-jpa", "org.hibernate.orm:hibernate-core",
  "org.postgresql:postgresql", "com.mysql:mysql-connector-j", "com.h2database:h2",
  "org.xerial:sqlite-jdbc", "org.mongodb:mongodb-driver-sync", "redis.clients:jedis",
  "org.jooq:jooq", "org.mybatis:mybatis", "org.flywaydb:flyway-core", "org.liquibase:liquibase-core",
]
cli = ["info.picocli:picocli", "commons-cli:commons-cli", "com.beust:jcommander"]
observability = [
  "io.opentelemetry:opentelemetry-api", "io.opentelemetry:opentelemetry-sdk", "org.slf4j:slf4j-api",
  "ch.qos.logback:logback-classic", "org.apache.logging.log4j:log4j-core", "io.micrometer:micrometer-core",
]

[[roles]]
role = "entry_point"
libraries = [
  "org.springframework.boot:spring-boot-starter-web", "org.springframework.boot:spring-boot-starter-webflux",
  "io.javalin:javalin", "io.vertx:vertx-web", "io.quarkus:quarkus-rest", "info.picocli:picocli",
  "io.ktor:ktor-server-core", "io.ktor:ktor-server-netty", "com.github.ajalt.clikt:clikt",
]
paths = [
  "com.sun.net.httpserver", "jakarta.servlet", "javax.servlet", "io.ktor.server", "io.ktor.application",
  "io.ktor.routing", "io.javalin", "org.springframework.web.bind.annotation",
]
confidence = 0.8

[[roles]]
role = "persistence"
libraries = [
  "org.springframework.boot:spring-boot-starter-data-jpa", "org.hibernate.orm:hibernate-core",
  "org.postgresql:postgresql", "com.mysql:mysql-connector-j", "org.xerial:sqlite-jdbc",
  "org.mongodb:mongodb-driver-sync", "redis.clients:jedis", "org.jooq:jooq", "org.mybatis:mybatis",
]
paths = ["java.sql", "javax.sql", "jakarta.persistence", "javax.persistence", "org.jetbrains.exposed", "androidx.room"]
confidence = 0.8

[[roles]]
role = "data_model"
libraries = ["com.fasterxml.jackson.core:jackson-databind", "com.google.code.gson:gson"]
paths = ["com.fasterxml.jackson.annotation"]
confidence = 0.5

[[roles]]
role = "interface"
libraries = ["org.openjfx:javafx-controls", "org.jetbrains.compose.runtime:runtime"]
paths = ["javax.swing", "java.awt", "javafx", "androidx.compose", "android.app"]
confidence = 0.8

[[roles]]
role = "background_task"
libraries = ["org.jetbrains.kotlinx:kotlinx-coroutines-core"]
paths = ["java.util.concurrent", "kotlinx.coroutines"]
confidence = 0.5

# What refinement needs to know of the language (ADR 0022).
[lsp]
# `kotlin.*`, imported by every file: a name tree-sitter cannot resolve that is one of them is
# defined outside the repository, and the language server is not asked.
outside = [
  "String", "Int", "Long", "Double", "Float", "Boolean", "Char", "Byte", "Short", "Unit", "Any",
  "Nothing", "List", "MutableList", "Map", "MutableMap", "Set", "MutableSet", "Array", "Pair",
  "Triple", "listOf", "mutableListOf", "mapOf", "mutableMapOf", "setOf", "arrayOf", "println",
  "print", "require", "check", "error", "TODO", "lazy", "repeat", "run", "let", "also", "apply",
  "with", "Exception", "RuntimeException", "IllegalArgumentException", "IllegalStateException",
  "this", "super", "it",
]

# How the tests run and write JUnit XML (ADR 0034): Gradle writes it, one file per class and per
# project; `junit` names the folder, `**/` under any project (ADR 0064). Checked with Gradle
# 9.8.2, Kotlin 2.2 and JDK 25. The project's wrapper comes first.
[[tests.runners]]
name = "gradle (wrapper)"
when = "gradlew"
command = "./gradlew test --rerun --continue"
junit = "**/build/test-results/test/"
program = "java"
note = "Timonier runs the tests with the project's Gradle wrapper, which needs a JDK: install one (https://adoptium.net/)."

[tests.runners.smoke]
command = "./gradlew test --rerun --tests timonier.TimonierSmokeTest"
files = [{ path = "src/test/kotlin/timonier/TimonierSmokeTest.kt", source = "instrumentation/TimonierSmokeTest.kt" }]

[[tests.runners]]
name = "gradle"
command = "gradle test --rerun --continue"
junit = "**/build/test-results/test/"
program = "gradle"
note = "Timonier runs the tests with Gradle: install it (https://gradle.org/install/), with a JDK, or add the Gradle wrapper to the project (`gradle wrapper`)."

[tests.runners.smoke]
command = "gradle test --rerun --tests timonier.TimonierSmokeTest"
files = [{ path = "src/test/kotlin/timonier/TimonierSmokeTest.kt", source = "instrumentation/TimonierSmokeTest.kt" }]

# The OpenTelemetry SDK `timonier init` adds (spec « Initialisation », 3; ADR 0050, 0066): the
# API among the project's dependencies (the code that ships uses it, Q78), the SDK, its OTLP
# exporter and its autoconfiguration for the tests. Verified on Maven Central on 2026-10-22,
# upgraded together.
[instrumentation]
files = [{ path = "src/test/kotlin/timonier/TimonierOtel.kt", source = "instrumentation/TimonierOtel.kt" }]
note = "the object `timonier.TimonierOtel` starts the export: call `TimonierOtel.start()` where the tests set up (a JUnit extension, or a `@BeforeAll`), as the conventions say. The smoke test is written for JUnit 5."

[[instrumentation.dependencies]]
name = "io.opentelemetry:opentelemetry-api"
version = "1.67.0"
production = true

[[instrumentation.dependencies]]
name = "io.opentelemetry:opentelemetry-sdk"
version = "1.67.0"

[[instrumentation.dependencies]]
name = "io.opentelemetry:opentelemetry-exporter-otlp"
version = "1.67.0"

[[instrumentation.dependencies]]
name = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure"
version = "1.67.0"

# The technology inventory (ADR 0055): frameworks, and the precise function of known libraries:
# two direct dependencies of the same function are a duplicate.
[inventory]
frameworks = [
  "io.ktor:ktor-server-core", "org.jetbrains.compose.runtime:runtime",
  "org.springframework.boot:spring-boot-starter", "org.springframework.boot:spring-boot-starter-web",
  "io.quarkus:quarkus-core", "io.micronaut:micronaut-core", "io.javalin:javalin", "io.vertx:vertx-core",
]

[inventory.functions]
http-client = ["com.squareup.okhttp3:okhttp", "org.apache.httpcomponents.client5:httpclient5", "org.apache.httpcomponents:httpclient", "com.squareup.retrofit2:retrofit"]
json = ["org.jetbrains.kotlinx:kotlinx-serialization-json", "com.fasterxml.jackson.core:jackson-databind", "com.google.code.gson:gson", "org.json:json", "com.squareup.moshi:moshi"]
logging = ["ch.qos.logback:logback-classic", "org.apache.logging.log4j:log4j-core", "org.slf4j:slf4j-simple"]
test-framework = ["org.junit.jupiter:junit-jupiter", "junit:junit", "org.testng:testng", "io.kotest:kotest-runner-junit5"]
assertions = ["org.assertj:assertj-core", "org.hamcrest:hamcrest", "com.google.truth:truth"]
mocking = ["org.mockito:mockito-core", "io.mockk:mockk", "org.easymock:easymock"]
orm = ["org.hibernate.orm:hibernate-core", "org.jooq:jooq", "org.mybatis:mybatis", "org.eclipse.persistence:eclipselink"]
migrations = ["org.flywaydb:flyway-core", "org.liquibase:liquibase-core"]
cli-parser = ["info.picocli:picocli", "commons-cli:commons-cli", "com.beust:jcommander"]
