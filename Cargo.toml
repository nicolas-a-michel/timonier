[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Nicolas Michel"]
repository = "https://github.com/nicolas-a-michel/timonier"
publish = false

[workspace.dependencies]
# The inventory (ADR 0055): known vulnerabilities from OSV, on demand; the CycloneDX SBOM.
ureq = { version = "3.4.2" }
# gzip of OTLP/HTTP on the agents' port (ADR 0058); already in the tree through png and ureq.
flate2 = { version = "1.1.10" }
# The run tokens on every system (/dev/urandom is not on Windows); already in the tree through uuid.
getrandom = { version = "0.4.3" }
# SetHandleInformation, for the daemon started in the background on Windows (ADR 0060); already
# in the tree through clap and tokio.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }
cyclonedx-bom = { version = "0.8.1" }
# Internal crates. Dependency direction: docs/adr/0003-decoupage-des-crates.md
timonier-core = { path = "crates/timonier-core" }
timonier-store = { path = "crates/timonier-store" }
timonier-index = { path = "crates/timonier-index" }
timonier-otlp = { path = "crates/timonier-otlp" }
timonier-daemon = { path = "crates/timonier-daemon" }
timonier-mcp = { path = "crates/timonier-mcp" }

# External crates: versions and licences verified, see PLAN.md « Dépendances vérifiées ».
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
proptest = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Unified diffs of `timonier init --dry-run` (ADR 0033); already in the lock through insta.
similar = "2.7.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
assert_cmd = "2.2.2"
blake3 = "1.8.7"
globset = "0.4.20"
ignore = "0.4.33"
insta = "1.49.0"
notify-debouncer-full = "0.7.0"
rayon = "1.12.0"
roxmltree = "0.21.1"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.7.4"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-php = "0.25.1"
tree-sitter-scala = "0.26.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"] }
ts-rs = "12.0.1"
# MCP SDK and JSON schemas of the tools' inputs (ADR 0027), verified 2026-10-20.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2.3"
# Draws the whiteboard's sketch as a PNG for the agent's vision (ADR 0040).
tiny-skia = "0.12.0"
# `timonier test` (ADR 0045, 0046), verified 2026-10-21: the JUnit XML of the runners, the
# relay's getrusage, the instruction counters (Linux).
junit-parser = { version = "1.7.0", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["resource"] }
perf-event = "0.4.9"
# The OTLP receiver (ADR 0048), verified 2026-10-21: gRPC and HTTP on one port.
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "trace", "metrics", "logs", "with-serde"] }
prost = "0.14.4"
tonic = { version = "0.14.6", default-features = false, features = ["server", "router", "codegen"] }
# OpenTelemetry's own SDK and exporter (ADR 0044), verified 2026-10-21: always upgraded together.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "grpc-tonic"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }

[workspace.lints.rust]
# Denied, not forbidden: one Windows function may allow it (ADR 0060, `daemon::private_handles`).
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
