name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: Rust MSRV (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the rust-version declared in Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      - run: cargo +"$MSRV" check --workspace --all-targets

  extension:
    name: Extension and webview (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (webview, extension, Claude Code hooks)
        run: npm test
      # WCAG AA of the design system in every VSCode theme (ADR 0020). The themes are the same on
      # every system: Linux is enough.
      - name: Accessibility tests (axe-core in Chromium)
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:a11y
      # The integration tests launch a real daemon: `npm run test:integration` builds it.
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Integration tests in VSCode (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests in VSCode (macOS)
        if: runner.os == 'macOS'
        run: npm run test:integration
      - name: Package the extension
        run: npm run package
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: timonier-vsix
          path: editors/vscode/timonier.vsix
          if-no-files-found: error
