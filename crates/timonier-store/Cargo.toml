[package]
name = "timonier-store"
description = "Timonier storage: SQLite schema, migrations, snapshots and snapshot diffs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
timonier-core = { workspace = true }
# u64 columns of the measurements (ADR 0043), refused beyond i64::MAX.
rusqlite = { workspace = true, features = ["fallible_uint"] }
rusqlite_migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
